<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AttackCast</title>
    <meta name="description" content="Where the intrusion goes next, ranked by evidence." />
    <script>
      // Stamp the resolved theme before first paint so there is no flash.
      try {
        const stored = localStorage.getItem("attackcast-theme");
        const system = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.dataset.theme = stored === "light" || stored === "dark" ? stored : system;
      } catch { document.documentElement.dataset.theme = "light"; }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
